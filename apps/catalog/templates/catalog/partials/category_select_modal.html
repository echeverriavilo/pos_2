<div class="modal fade" id="categorySelectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nueva Categoría</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form method="post"
                      hx-post="{% url 'catalog:category-select-modal' %}"
                      hx-target="#modal-container"
                      hx-swap="innerHTML">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Nombre de la categoría</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Ej: Bebidas" required autofocus>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-plus-circle me-1"></i>Crear
                        </button>
                    </div>
                    {% if error %}
                    <div class="text-danger small mt-2">{{ error }}</div>
                    {% endif %}
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        var modalEl = document.getElementById('categorySelectModal');
        if (modalEl._bootstrapModal) modalEl._bootstrapModal.dispose();
        var modal = new bootstrap.Modal(modalEl);
        modalEl._bootstrapModal = modal;
        modal.show();
        modalEl.addEventListener('hidden.bs.modal', function () {
            document.getElementById('modal-container').innerHTML = '';
        });
    })();
</script>
